<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro e Inicio de Sesión</title>
  <link rel="stylesheet" href="registro.css">
</head>

<body>
  <div class="navbar">
    <div class="logo">
      <img src="Img/logoaspa.png" alt="Virtual Tec">
      <p><a href="#login" class="sesion" style="font-size: 19px; font-weight: bolder;">Inicio</a></p>
    </div>

    <div class="acceso">
      <a href="registro.html" class="sesion" id="inico" style="font-size: 16px; font-weight: bolder;">Acceder</a>
    </div>
  </div>
  <div class="visible" id="divregistro">
    <div class="formulario" id="formregistro">
      <center>
        <center><img src="Img/logofullreal.png" src="#" id="logogin"></center>
        <h2>Crear cuenta en AgroNova</h2>
        <input id="usuarioRegistro" placeholder="Nombre de usuario">
        <input id="correoRegistro" type="email" placeholder="Correo electrónico">
        <input type="password" id="passRegistro" placeholder="Contraseña">
        <div class="terminos">
          <input type="checkbox" id="terminos">
          <p>Acepto los <a href="terminos.html">Términos y condiciones.</a></p>
        </div>
        <div id="mensaje" class="mensaje"></div>
        <button onclick="registrarUsuario()" onclick="mostrarLogin()">Registrarse</button>
        <button onclick="mostrarLogin()">Iniciar sesión</button>
      </center>
    </div>
  </div>

  <center><div class="oculto" id="divinicio">
    <div class="formulario" id="formlogin" style="display: block;">
      <center><img src="Img/logofullreal.png" src="#" id="logogin"></center>
      <h2>Iniciar Sesión</h2>
      <input id="usuarioLogin" placeholder="Usuario" class="inicioinput">
      <div class="espacio"></div>
      <input type="password" id="passLogin" placeholder="Contraseña" class="inicioinput">
      <div class="espacio"></div>
      <div class="espacio"></div>
      <div id="message" class="message"></div>
      <button onclick="iniciarSesion()">Ingresar</button>
      <button onclick="mostrarRegistro()">Registrarse</button>
    </div>
  </div></center>

  <script src="registro.js"></script>
</body>

</html>
