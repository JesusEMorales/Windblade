<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="estilosjesus.css">
  <script src="codigoVane.js"></script>
</head>

<body>
  <div class="registrodiv">
    <div class="registropag">
      <div class="registro">
        <h1>----</h1>
        <h2>Regístrate</h2>
      </div>
      <h1>----</h1>

      <div class="informacion">
        <label>Nombre</label>
        <input type="email" placeholder="Tu nombre" required id="Usuario">
      </div>

      <div class="informacion">
        <label>Apellido</label>
        <input type="email" placeholder="Apellido" required id="Usuario">
      </div>

      <div class="informacion">
        <label>Email</label>
        <input type="password" placeholder="name@gmail.com" required id="Contraseña">
      </div>

      <div class="informacion">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" required id="Contraseña">
      </div>
      
      <div class="informacion">
      <button type="button" class="login-btn" onclick="Registroparalocation()">Iniciar Sesión</button>
      <button type="button" class="register-btn" onclick="regresoinicio()">Regresar</button>
      </div>

      <div class="footer-links">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <button type="button" class="register-btn" onclick="Registro()">¿No tienes cuenta? Regístrate</button>
      </div>
    </div>
  </div>

</body>

</html>
